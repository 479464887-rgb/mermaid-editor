<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Mermaid Editor - 在线Mermaid图表实时预览编辑器"><meta property="og:title" content="Mermaid Editor"><title>Mermaid Editor</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh;display:flex;flex-direction:column;height:100vh}header{background:#161b22;border-bottom:1px solid #30363d;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;flex-shrink:0}header h1{font-size:20px;color:#58a6ff}.lang-switch{display:flex;gap:4px}.lang-switch button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}.lang-switch button.active{background:#1f6feb;border-color:#1f6feb;color:#fff}#editor-container{display:flex;flex:1;overflow:hidden}@media(max-width:768px){#editor-container{flex-direction:column}}.editor-panel{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid #30363d}.preview-panel{flex:1;display:flex;flex-direction:column;min-width:0;overflow:auto;padding:16px;justify-content:center;align-items:center}.editor-panel textarea{flex:1;width:100%;background:#0d1117;color:#c9d1d9;border:none;padding:12px;font-family:monospace;font-size:13px;resize:none;line-height:1.6;tab-size:2}.editor-panel textarea:focus{outline:none}.examples-bar{display:flex;gap:6px;padding:8px 12px;background:#21262d;border-bottom:1px solid #30363d;flex-wrap:wrap;overflow-x:auto}.examples-bar button{background:#30363d;color:#8b949e;border:none;padding:4px 10px;border-radius:12px;cursor:pointer;font-size:11px;white-space:nowrap}.examples-bar button:hover{color:#58a6ff}#preview{width:100%;max-width:100%}#preview svg{max-width:100%;height:auto}.error-msg{color:#f85149;font-size:13px;padding:16px;text-align:center}</style></head><body><header><h1>📊 Mermaid Editor</h1><div class="lang-switch"><button class="active" onclick="setLang('zh')">中文</button><button onclick="setLang('en')">EN</button></div></header><div id="editor-container"><div class="editor-panel"><div class="examples-bar"><button onclick="loadExample('flowchart')">流程图</button><button onclick="loadExample('sequence')">时序图</button><button onclick="loadExample('class')">类图</button><button onclick="loadExample('gantt')">甘特图</button><button onclick="loadExample('pie')">饼图</button><button onclick="loadExample('er')">ER图</button><button onclick="loadExample('state')">状态图</button></div><textarea id="code" oninput="renderMermaid()" spellcheck="false">graph TD
    A[开始] --> B{是否登录?}
    B -->|是| C[显示主页]
    B -->|否| D[跳转登录]
    C --> E[结束]
    D --> E</textarea></div><div class="preview-panel"><div id="preview"></div><div class="error-msg" id="error"></div></div></div><script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script><script>let lang='zh';function setLang(l){lang=l;document.querySelectorAll('.lang-switch button').forEach((b,i)=>b.classList.toggle('active',(i===0&&l==='zh')||(i===1&&l==='en')))}mermaid.initialize({startOnLoad:false,theme:'dark',securityLevel:'loose',themeVariables:{primaryColor:'#58a6ff',primaryTextColor:'#c9d1d9',primaryBorderColor:'#30363d',lineColor:'#8b949e',secondaryColor:'#21262d',tertiaryColor:'#0d1117'}});let renderTimer;function renderMermaid(){clearTimeout(renderTimer);renderTimer=setTimeout(async()=>{const code=document.getElementById('code').value;const preview=document.getElementById('preview');const error=document.getElementById('error');if(!code.trim()){preview.innerHTML='';error.textContent='';return}try{const id='mermaid-'+Date.now();const{svg}=await mermaid.render(id,code);preview.innerHTML=svg;error.textContent=''}catch(e){preview.innerHTML='';error.textContent='渲染错误: '+e.message}})}const examples={flowchart:'graph LR\n    A[方形] --> B(圆角)\n    B --> C{菱形}\n    C -->|是| D[结果1]\n    C -->|否| E[结果2]',sequence:'sequenceDiagram\n    Alice->>John: Hello John\n    John-->>Alice: Hi Alice\n    Alice->>John: How are you?\n    John-->>Alice: Great!',class:'classDiagram\n    Animal <|-- Duck\n    Animal <|-- Fish\n    Animal : +int age\n    Animal : +String gender\n    Animal: +isMammal()\n    Duck : +String beakColor\n    Duck: +swim()\n    Fish: -int size\n    Fish: +canEat()',gantt:'gantt\n    title 项目计划\n    dateFormat  YYYY-MM-DD\n    section 设计\n    需求分析    :a1, 2024-01-01, 7d\n    UI设计      :a2, after a1, 5d\n    section 开发\n    前端开发    :b1, after a2, 10d\n    后端开发    :b2, after a2, 12d\n    section 测试\n    集成测试    :c1, after b1 b2, 5d',pie:'pie title 浏览器市场份额\n    "Chrome" : 65\n    "Safari" : 19\n    "Firefox" : 8\n    "Edge" : 5\n    "Other" : 3',er:'erDiagram\n    CUSTOMER ||--o{ ORDER : places\n    ORDER ||--|{ LINE-ITEM : contains\n    CUSTOMER {\n        string name\n        string email\n    }\n    ORDER {\n        int orderNumber\n        date orderDate\n    }',state:'stateDiagram-v2\n    [*] --> Idle\n    Idle --> Loading : 开始加载\n    Loading --> Success : 成功\n    Loading --> Error : 失败\n    Error --> Loading : 重试\n    Success --> [*]'};function loadExample(name){document.getElementById('code').value=examples[name];renderMermaid()}renderMermaid()</script></body></html>
